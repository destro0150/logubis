<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">SIMUSTOP NASCAR SERIES</title>
